name: Operator OS desktop build

# Deliberately NOT run on every push/PR -- a macOS+Windows+Linux matrix build
# costs real GitHub Actions minutes (macOS runners in particular), and this
# app has no automated test suite yet to justify running it that often.
# Manual dispatch for now; a `desktop-v*` tag push once this is ready to
# actually distribute builds from.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

# tauri-action creates a GitHub release (releaseDraft: true below), which
# needs contents: write -- every other workflow in this repo has an explicit
# permissions block, this one was the one exception.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: operator-os/packaging/desktop
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      # Pinned to a commit, not the mutable `stable` branch ref: this job's
      # env carries real Apple code-signing secrets (APPLE_CERTIFICATE et
      # al. below), the same reasoning backup-verification.yml/
      # github-sync.yml/nightly-recompute.yml already pin
      # superfly/flyctl-actions to a SHA for (they hold FLY_API_TOKEN).
      # Bump this SHA deliberately when a newer stable toolchain is needed --
      # `git ls-remote https://github.com/dtolnay/rust-toolchain.git refs/heads/stable`.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09-21

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      # Real distribution needs these secrets set in the repo (Settings ->
      # Secrets and variables -> Actions), which needs the founder's own
      # Apple Developer / Windows code-signing certificates -- see
      # operator-os/packaging/README.md. Unsigned builds still work, they
      # just carry an OS-level "unidentified developer" warning on first
      # launch, which is fine for testing but not for a real release.
      # Pinned for the same reason as rust-toolchain above -- this step is
      # the one that actually consumes the Apple/GitHub secrets.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: operator-os/packaging/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Operator OS Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
