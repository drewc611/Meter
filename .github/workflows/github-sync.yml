name: GitHub PR/CI sync

# Runs github_sync.py against the live Fly deployment on a schedule instead
# of by hand -- see backend/github_sync.py's docstring for what it does.
# Needs MERIT_GITHUB_OWNER/MERIT_GITHUB_REPO/MERIT_GITHUB_TOKEN already set
# as Fly secrets (the script reads them from its own environment once SSHed
# in, not from this workflow) plus the FLY_API_TOKEN secret below -- see
# DEPLOY.md.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Sync merged PRs and CI status into Merit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console -a meter -C "python github_sync.py"
