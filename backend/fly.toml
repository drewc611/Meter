# fly.toml app configuration file generated for meter on 2026-08-09T00:21:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meter'
primary_region = 'iad'

[build]

[env]
  MERIT_CORS_ORIGINS = 'https://usemeritai.com,https://www.usemeritai.com'

[[mounts]]
  source = 'merit_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '10s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
