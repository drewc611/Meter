# Local-only stack: the backend API + the static dashboard, both built from
# source. Not intended for production deployment as-is — see comments below
# for the things you'd change first (login secret, CORS origins, sqlite -> Postgres).
#
#   docker compose up --build      # first run seeds 6 months of sample data
#   docker compose down            # stop (keeps the seeded data volume)
#   docker compose down -v         # stop and wipe the seeded data too

services:
  backend:
    build: ./backend
    ports:
      # Loopback only: this stack runs with login off (see below).
      - "127.0.0.1:8000:8000"
    volumes:
      # Named volume so the seeded/scored data survives `compose down` and
      # `compose up` again without re-seeding. `compose down -v` removes it.
      - merit-db:/data
    environment:
      # The dashboard is fetched from the browser at http://localhost:8000, not
      # proxied through the frontend container, so CORS is what has to allow
      # the frontend's published origin. Replace with your real origin(s)
      # before pointing this at real data; "*" is refused at startup.
      - MERIT_CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
      # Explicit opt-in to no login on /api/* and /admin/* for this local demo.
      # Ignored in production. For anything else set MERIT_JWT_SECRET instead
      # and remove this line.
      - MERIT_ALLOW_OPEN_DEV=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  merit-db:
