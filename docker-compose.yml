# Local-only stack: the backend API + the static dashboard, both built from
# source. Not intended for production deployment as-is — see comments below
# for the two things you'd change first (CORS origin, sqlite -> Postgres).
#
#   docker compose up --build      # first run seeds a month of sample data
#   docker compose down            # stop (keeps the seeded data volume)
#   docker compose down -v         # stop and wipe the seeded data too

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Named volume so the seeded/scored data survives `compose down` and
      # `compose up` again without re-seeding. `compose down -v` removes it.
      - meter-db:/data
    environment:
      # Wide open by default, matching the backend's local-dev default (see
      # backend/app/config.py) — the dashboard is fetched from the browser at
      # http://localhost:8000, not proxied through the frontend container, so
      # CORS is what has to allow it. Narrow this to the frontend's published
      # origin (http://localhost:8080) before pointing this at real data.
      - METER_CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  meter-db:
